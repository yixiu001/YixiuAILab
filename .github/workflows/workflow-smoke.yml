name: Workflow smoke

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  smoke-tests:
    name: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out synthetic fixture
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
